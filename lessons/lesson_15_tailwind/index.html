<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lesson 15 | Tailwind</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body class="bg-black">

    <h1 class="text-3xl font-bold uderline">Hello, World!</h1>

    <div
        class="mx-auto flex max-w-sm items-center gap-x-4 rounded-xl bg-white p-6 shadow-lg outline outline-black/5 dark:bg-slate-800 dark:shadow-none dark:-outline-offset-1 dark:outline-white/10">
        <img class="size-12 shrink-0" src="./img/logo.png" alt="ChitChat Logo" />
        <div>
            <div class="text-xl font-medium text-black dark:text-white">ChitChat</div>
            <p class="text-gray-500 dark:text-gray-400">You have a new message!</p>
        </div>
    </div>

    <div>
        <div>
            <img src="./img/avatar.webp" alt="avatar">
            <div>
                <div>
                    <p>Erin Lindford</p>
                    <p>Product Engineer</p>
                </div>
                <button>Message</button>
            </div>
        </div>
    </div>

    <div>
        <div class="
        flex flex-col gap-2 p-8 bg-white min-w-max w-3/5 mx-auto rounded-lg">
            <img class="
            mx-auto block h-24 rounded-full" src="./img/avatar.webp" alt="avatar">
            <div class="space-y-2 text-center">
                <div class="space-y-0.5">
                    <p class="text-lg font-semibold text-black">Erin Lindford</p>
                    <p class="font-medium text-gray-500">Product Engineer</p>
                </div>
                <button
                    class="
                        px-4 py-1 font-semibold rounded-3xl border border-solid border-purple-200 text-purple-600">
                        Message
                    </button>
            </div>
        </div>
    </div>

    <div class="my-3">
        <div class="
        flex flex-col gap-2 p-8 bg-white w-3/5 mx-auto rounded-lg
        sm:flex-row sm:items-center sm:gap-6 sm:py-4 sm:w-3/5 sm:max-w-sm
        dark:bg-slate-800">
            <img class="
            mx-auto block h-24 rounded-full
            sm:mx-0 sm:shrink-0
            " src="./img/avatar.webp" alt="avatar">
            <div class="space-y-2 text-center sm:text-left">
                <div class="space-y-0.5">
                    <p class="text-lg font-semibold text-black
                            dark:text-zinc-300">Erin Lindford</p>
                    <p class="font-medium text-gray-500
                            dark:text-zinc-400">Product Engineer</p>
                </div>
                <button class="
                px-4 py-1 font-semibold rounded-3xl border border-solid border-purple-200 text-purple-600
                hover:border-transparent hover:bg-purple-600 hover:text-white active:bg-purple-700
                dark:text-violet-600 dark:border-violet-600
                dark:hover:bg-viotel-600
                ">
                    Message
                </button>
            </div>
        </div>
    </div>
</body>

</html>
